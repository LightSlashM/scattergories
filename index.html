<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scattergories with Friends</title>
<style>
  :root {
    --bg: #fbf6ee; --card: #ffffff; --ink: #2a2522; --muted: #8a8079;
    --accent: #e8572a; --accent-2: #2a7de1; --good: #2f9e5b; --bad: #d64545;
    --line: #ece4d8; --chip: #f4ede2; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-size: 44px; margin: 0 0 4px; letter-spacing: -1px; }
  h1 span { color: var(--accent); }
  h2 { margin: 18px 0 8px; font-size: 22px; }
  h3 { margin: 0 0 8px; font-size: 16px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: 0 2px 10px rgba(60,40,20,.05); }
  .home { max-width: 420px; margin: 8vh auto 0; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
  input, select {
    font: inherit; width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink); outline: none; margin-top: 6px;
  }
  input:focus, select:focus { border-color: var(--accent-2); }
  input:disabled { background: #f6f2ec; color: var(--muted); }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer;
    background: var(--chip); color: var(--ink); transition: transform .05s, filter .15s;
  }
  button:hover { filter: brightness(.97); }
  button:active { transform: scale(.98); }
  button.primary { background: var(--accent); color: #fff; width: 100%; font-size: 17px; padding: 14px; }
  button.small { padding: 6px 12px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .row input { margin-top: 0; }
  .or { text-align: center; color: var(--muted); margin: 16px 0 10px; font-size: 14px; }
  .code-in { text-transform: uppercase; letter-spacing: 4px; font-weight: 700; text-align: center; }
  .err { color: var(--bad); font-weight: 600; }
  .link { background: none; padding: 8px 0 0; color: var(--muted); font-weight: 500; text-decoration: underline; font-size: 14px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
  .topbar b { color: var(--ink); letter-spacing: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
  .chip.me { outline: 2px solid var(--accent-2); }
  .chip.off { opacity: .45; }
  .chip.done { background: #dff3e6; color: var(--good); }
  .chip small { font-weight: 500; color: var(--muted); }

  .invite { display: flex; gap: 8px; align-items: center; background: var(--chip); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .invite code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .settings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 18px; }
  .settings label { margin: 0; font-size: 13px; }
  .settings .val { font-size: 20px; font-weight: 700; margin-top: 6px; }
  .waiting { text-align: center; color: var(--muted); padding: 14px; }

  .stage { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 6px 0 10px; }
  .letter {
    width: 96px; height: 96px; border-radius: 22px; background: var(--ink); color: #fff; font-size: 60px; font-weight: 800;
    display: grid; place-items: center; box-shadow: 0 6px 0 #00000022; transform: rotate(-4deg);
  }
  .timer { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 120px; text-align: center; }
  .timer.low { color: var(--bad); }
  .timer.over { color: var(--muted); font-size: 26px; }
  ol.answers { list-style: none; padding: 0; margin: 0; counter-reset: c; }
  ol.answers li { counter-increment: c; margin-bottom: 10px; }
  ol.answers label { margin: 0; font-weight: 600; font-size: 14px; }
  ol.answers label::before { content: counter(c) ". "; color: var(--accent); }
  .hint { color: var(--muted); font-size: 14px; text-align: center; margin: 8px 0 14px; }
  .overlay { position: fixed; inset: 0; background: rgba(251,246,238,.92); display: grid; place-items: center; z-index: 10; text-align: center; }
  .overlay .big { font-size: 120px; font-weight: 800; color: var(--accent); line-height: 1; }

  .cat { margin-bottom: 14px; }
  .ans { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: #f8f4ee; margin-bottom: 6px; border-left: 4px solid var(--good); }
  .ans.invalid { border-left-color: var(--bad); }
  .ans.dup { border-left-color: #c9a227; }
  .ans.empty { border-left-color: var(--line); opacity: .55; }
  .ans .txt { font-weight: 700; font-size: 17px; word-break: break-word; }
  .ans.invalid .txt, .ans.dup .txt { text-decoration: line-through; text-decoration-thickness: 2px; }
  .ans .who { font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: middle; text-decoration: none; }
  .tag.dup { background: #fbefc6; color: #8a6d00; }
  .tag.wrong { background: #fde2e2; color: var(--bad); }
  .tag.pt { background: #dff3e6; color: var(--good); }
  .tag.zero { background: #eee; color: var(--muted); }
  .votes { display: flex; gap: 6px; grid-row: span 2; }
  .votes button { padding: 8px 10px; font-size: 15px; background: #fff; border: 2px solid var(--line); min-width: 54px; }
  .votes button.on.up { border-color: var(--good); background: #e9f7ee; }
  .votes button.on.down { border-color: var(--bad); background: #fdeaea; }
  .votes .mine { font-size: 12px; color: var(--muted); align-self: center; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 5; }
  .dock .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .dock .status { flex: 1; font-size: 14px; color: var(--muted); }
  .dock button.go { background: var(--accent); color: #fff; }
  .dock button.go.isdone { background: var(--good); }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .trophy { font-size: 64px; text-align: center; margin-top: 10px; }
  .winner { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 14px; }
  .setup { max-width: 560px; margin: 8vh auto; line-height: 1.5; }
  .setup code { background: var(--chip); padding: 2px 6px; border-radius: 6px; }
  @media (max-width: 520px) {
    h1 { font-size: 36px; }
    .letter { width: 76px; height: 76px; font-size: 46px; }
    .timer { font-size: 36px; }
    .settings { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, onDisconnect, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* =====================================================================
   PASTE YOUR FIREBASE CONFIG HERE
   (Firebase console → Project settings → Your apps → Web app → Config)
   Make sure it includes databaseURL.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAT5-dz4oerdZbyxok4aF-mujN7ll-qy3s",
  authDomain: "scattergories-friends.firebaseapp.com",
  databaseURL: "https://scattergories-friends-default-rtdb.firebaseio.com",
  projectId: "scattergories-friends",
  storageBucket: "scattergories-friends.firebasestorage.app",
  messagingSenderId: "540032330191",
  appId: "1:540032330191:web:c122f3c4836c6c36cd8aba"
};
/* ===================================================================== */

const CATEGORIES = [
  "A boy's name", "A girl's name", "Animals", "Things in a kitchen", "Fruits", "Vegetables",
  "Cities", "Countries", "U.S. states", "Rivers", "Bodies of water", "Things at a beach",
  "Sports", "Sports teams", "Musical instruments", "Bands or musicians", "Song titles", "Movie titles",
  "TV shows", "Cartoon characters", "Fictional characters", "Superheroes", "Video games", "Board games",
  "Famous people", "Athletes", "Historical figures", "Things you wear", "Things in a closet", "Shoes",
  "Car brands", "Things with wheels", "Things that fly", "Things that are cold", "Things that are hot", "Things that are sticky",
  "Things that are round", "Things that are red", "Things that are green", "Things in the sky", "Things in a park", "Things at a wedding",
  "Things at a party", "Party snacks", "Desserts", "Candy", "Breakfast foods", "Pizza toppings",
  "Cocktails or drinks", "Fast food chains", "Restaurant menu items", "Spices or herbs", "Cheeses", "Sandwiches",
  "Things in a bathroom", "Furniture", "Household chores", "Tools", "Office supplies", "School subjects",
  "Things in a backpack", "Things you can't live without", "Things you shout", "Excuses for being late", "Reasons to call 911", "Things you'd find in a junk drawer",
  "Occupations", "Hobbies", "Things you do at the gym", "Exercises", "Body parts", "Words ending in -ing",
  "Adjectives", "Verbs", "Things that are scary", "Things you're afraid of", "Things you save up for", "Gifts",
  "Holidays", "Vacation spots", "Things you pack for a trip", "Apps or websites", "Things on a farm", "Insects",
  "Birds", "Fish or sea creatures", "Dog breeds", "Flowers", "Trees", "Weather words",
  "Things in Chicago", "Celebrities", "Things that make noise", "Things you plug in", "Things with buttons", "Things with a tail",
  "Things that are soft", "Things that are expensive", "Things you can break", "Things you throw away", "Things in a hospital", "Things at a zoo",
  "Things in space", "Mythical creatures", "Languages", "Colors", "Pet names", "Nicknames",
  "Brands", "Magazines or newspapers", "Things in a garage", "Halloween costumes", "Things associated with winter", "Things associated with summer",
  "Things you sit on", "Things you get in the mail", "Bad habits", "Things grandparents say", "Ways to get around", "Kinds of dances"
];
const LETTERS = "ABCDEFGHIJKLMNOPRSTW".split(""); // no Q, U, V, X, Y, Z

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// Firebase can return objects with numeric keys as arrays (with null gaps). Normalize to entries.
const entriesOf = x => !x ? [] : Array.isArray(x) ? x.map((v, i) => [String(i), v]).filter(([, v]) => v != null) : Object.entries(x);
const arr = x => !x ? [] : Array.isArray(x) ? x.filter(v => v != null) : Object.values(x);

const configured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("PASTE") && firebaseConfig.databaseURL;
if (!configured) {
  $app.innerHTML = `<div class="card setup"><h2>Almost ready</h2>
    <p>This game needs a free Firebase Realtime Database to sync players.</p>
    <p>Open <code>index.html</code>, find <code>firebaseConfig</code> near the top of the script, and paste in your Firebase web app config (including <code>databaseURL</code>). See the README for step-by-step setup.</p></div>`;
} else {
  main();
}

function main() {
  const fb = initializeApp(firebaseConfig);
  const db = getDatabase(fb);

  const pid = store.get("sg_pid") || (() => {
    const id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    store.set("sg_pid", id); return id;
  })();

  let offset = 0;
  onValue(ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });
  const now = () => Date.now() + offset;

  let CODE = null;      // current room code
  let room = null;      // latest room snapshot
  let viewKey = null;   // which screen is rendered
  let unsubRoom = null;
  let acted = "";       // guards host automation from firing twice
  let view = {};        // per-screen local state

  const roomPath = (p = "") => `rooms/${CODE}${p ? "/" + p : ""}`;
  const inviteUrl = () => `${location.origin}${location.pathname}?room=${CODE}`;
  const playerIds = () => entriesOf(room?.players)
    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0) || a[0].localeCompare(b[0]))
    .map(([id]) => id);
  const onlineIds = () => playerIds().filter(id => room.players[id].online);
  const hostId = () => onlineIds()[0];
  const isHost = () => hostId() === pid;
  const nameOf = id => room?.players?.[id]?.name || "?";

  // ---------- Home ----------
  function renderHome(err) {
    viewKey = null;
    const code = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
    $app.innerHTML = `
      <div class="card home">
        <h1>Scatter<span>gories</span></h1>
        <p class="sub">Play live with friends, anywhere.</p>
        <label>Display name<input id="name" maxlength="20" placeholder="Your name" value="${esc(store.get("sg_name") || "")}"></label>
        ${code ? `
          <button id="joinUrl" class="primary">Join room ${esc(code)}</button>
          <button id="fresh" class="link">Start a different room instead</button>` : `
          <button id="create" class="primary">Create a room</button>
          <div class="or">or join a friend's room</div>
          <div class="row"><input id="code" class="code-in" maxlength="4" placeholder="CODE"><button id="join">Join</button></div>`}
        ${err ? `<p class="err">${esc(err)}</p>` : ""}
      </div>`;
    const nameEl = document.getElementById("name");
    const getName = () => {
      const n = nameEl.value.trim();
      if (!n) { nameEl.focus(); nameEl.style.borderColor = "var(--bad)"; return null; }
      store.set("sg_name", n); return n;
    };
    document.getElementById("create")?.addEventListener("click", async () => { const n = getName(); if (n) createRoom(n); });
    document.getElementById("join")?.addEventListener("click", () => {
      const n = getName(); const c = document.getElementById("code").value.trim().toUpperCase();
      if (n && c) joinRoom(c, n);
    });
    document.getElementById("code")?.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("join").click(); });
    document.getElementById("joinUrl")?.addEventListener("click", () => { const n = getName(); if (n) joinRoom(code, n); });
    document.getElementById("fresh")?.addEventListener("click", () => { history.replaceState(null, "", location.pathname); renderHome(); });
  }

  async function createRoom(name) {
    const chars = "ABCDEFGHJKLMNPRSTUVWXYZ";
    let code;
    for (let tries = 0; tries < 10; tries++) {
      code = Array.from({ length: 4 }, () => pick(chars)).join("");
      const s = await get(ref(db, `rooms/${code}/createdAt`));
      if (!s.exists()) break;
    }
    await set(ref(db, `rooms/${code}`), {
      createdAt: serverTimestamp(), phase: "lobby", round: 0,
      settings: { timer: 120, cats: 12, rounds: 5 }
    });
    joinRoom(code, name);
  }

  async function joinRoom(code, name) {
    try {
      const exists = await get(ref(db, `rooms/${code}/createdAt`));
      if (!exists.exists()) return renderHome(`Room ${code} wasn't found. Check the code.`);
      CODE = code;
      const meRef = ref(db, roomPath(`players/${pid}`));
      const me = await get(meRef);
      if (me.exists()) await update(meRef, { name, online: true });
      else await set(meRef, { name, joinedAt: serverTimestamp(), online: true, done: false });
      onValue(ref(db, ".info/connected"), s => {
        if (s.val() && CODE === code) {
          const onRef = ref(db, `rooms/${code}/players/${pid}/online`);
          onDisconnect(onRef).set(false);
          set(onRef, true);
        }
      });
      history.replaceState(null, "", `?room=${code}`);
      if (unsubRoom) unsubRoom();
      unsubRoom = onValue(ref(db, `rooms/${code}`), s => { room = s.val(); onRoom(); });
    } catch (e) {
      console.error(e);
      renderHome("Couldn't connect: " + e.message);
    }
  }

  // ---------- Room state → screens ----------
  function onRoom() {
    if (!room) { renderHome("That room no longer exists."); return; }
    const key = `${room.phase}:${room.round}:${isHost()}`;
    if (key !== viewKey) {
      if (view.pending) flush();
      if (room.phase === "lobby") acted = "";
      viewKey = key; view = {}; render();
    }
    else refresh();
  }

  function render() {
    ({ lobby: renderLobby, answering: renderAnswering, voting: renderVoting, scores: renderScores, final: renderScores }[room.phase] || renderLobby)();
  }
  function refresh() {
    ({ lobby: refreshLobby, answering: refreshAnswering, voting: refreshVoting, scores: () => {}, final: () => {} }[room.phase] || (() => {}))();
  }

  function topbar() {
    const r = room.round || 0, R = room.settings?.rounds || 0;
    return `<div class="topbar">
      <span>Room <b>${esc(CODE)}</b> <button class="small" data-copy>Copy invite link</button></span>
      ${r ? `<span>Round ${r} of ${R}</span>` : ""}
    </div>`;
  }
  function wireCopy() {
    $app.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
      b.dataset.label = b.dataset.label || b.textContent;
      try { await navigator.clipboard.writeText(inviteUrl()); b.textContent = "Copied!"; }
      catch { prompt("Copy this link:", inviteUrl()); }
      setTimeout(() => (b.textContent = b.dataset.label || "Copy invite link"), 1500);
    }));
  }
  function playerChips(extra = () => "", cls = () => "") {
    return playerIds().map(id => {
      const p = room.players[id];
      return `<span class="chip ${id === pid ? "me" : ""} ${p.online ? "" : "off"} ${cls(id)}">${esc(p.name)}${id === hostId() ? " 👑" : ""}${extra(id)}</span>`;
    }).join("");
  }

  // ---------- Lobby ----------
  function renderLobby() {
    const s = room.settings;
    const sel = (key, opts, fmt) => isHost()
      ? `<select data-set="${key}">${opts.map(o => `<option value="${o}" ${o === s[key] ? "selected" : ""}>${fmt(o)}</option>`).join("")}</select>`
      : `<div class="val" data-val="${key}">${fmt(s[key])}</div>`;
    const fmtTime = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
    $app.innerHTML = `
      ${topbar()}
      <div class="card">
        <h2 style="margin-top:0">Lobby</h2>
        <div class="invite"><code>${esc(inviteUrl())}</code><button class="small" data-copy>Copy</button></div>
        <h3 style="margin-top:16px">Players</h3>
        <div class="chips" id="players">${playerChips()}</div>
        <div class="settings">
          <label>Timer${sel("timer", [60, 90, 120, 150, 180], fmtTime)}</label>
          <label>Categories${sel("cats", [6, 8, 10, 12], x => x)}</label>
          <label>Rounds${sel("rounds", [1, 2, 3, 4, 5, 6, 8, 10], x => x)}</label>
        </div>
        ${isHost()
          ? `<button class="primary" id="start">Start game</button>`
          : `<div class="waiting">Waiting for ${esc(nameOf(hostId()))} to start…</div>`}
      </div>`;
    wireCopy();
    $app.querySelectorAll("[data-set]").forEach(el => el.addEventListener("change", () =>
      set(ref(db, roomPath(`settings/${el.dataset.set}`)), Number(el.value))));
    document.getElementById("start")?.addEventListener("click", startRound);
  }
  function refreshLobby() {
    const p = document.getElementById("players"); if (p) p.innerHTML = playerChips();
    const fmtTime = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
    $app.querySelectorAll("[data-val]").forEach(el => {
      const k = el.dataset.val, v = room.settings[k];
      el.textContent = k === "timer" ? fmtTime(v) : v;
    });
    $app.querySelectorAll("[data-set]").forEach(el => {
      if (document.activeElement !== el) el.value = room.settings[el.dataset.set];
    });
  }

  function startRound() {
    const s = room.settings;
    let used = arr(room.usedLetters);
    let pool = LETTERS.filter(l => !used.includes(l));
    if (!pool.length) { used = []; pool = LETTERS.slice(); }
    const letter = pick(pool);
    const t = now();
    const upd = {
      phase: "answering", round: (room.round || 0) + 1, letter,
      usedLetters: [...used, letter],
      categories: shuffle(CATEGORIES.slice()).slice(0, s.cats),
      roundStartsAt: t + 4000, roundEndsAt: t + 4000 + s.timer * 1000, nextAt: null
    };
    for (const id of playerIds()) upd[`players/${id}/done`] = false;
    update(ref(db, roomPath()), upd);
  }

  // ---------- Answering ----------
  function myAnswers() { return room.answers?.[room.round]?.[pid] || {}; }
  function renderAnswering() {
    const cats = arr(room.categories), mine = myAnswers();
    $app.innerHTML = `
      ${topbar()}
      <div class="stage"><div class="letter" id="letter">?</div><div class="timer" id="timer">--:--</div></div>
      <div class="chips" id="progress"></div>
      <ol class="answers">
        ${cats.map((c, i) => `<li><label for="a${i}">${esc(c)}</label>
          <input id="a${i}" data-i="${i}" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60" disabled value="${esc(mine[i] ?? "")}"></li>`).join("")}
      </ol>
      <p class="hint">Answers save as you type. When the timer hits 0, they lock in automatically.</p>
      <div class="overlay" id="overlay"><div><div style="font-weight:700;color:var(--muted)">Round ${room.round} starting in</div><div class="big" id="count">3</div></div></div>`;
    wireCopy();
    view.pending = {};
    view.round = room.round;
    view.inputs = [...$app.querySelectorAll("ol.answers input")];
    view.inputs.forEach((el, idx) => {
      el.addEventListener("input", () => { view.pending[el.dataset.i] = el.value.trim(); clearTimeout(view.t); view.t = setTimeout(flush, 350); });
      el.addEventListener("blur", flush);
      el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); view.inputs[idx + 1]?.focus(); } });
    });
    refreshAnswering();
    tick();
  }
  function flush() {
    if (!view.pending || !Object.keys(view.pending).length || !CODE) return;
    const r = view.round, upd = {};
    for (const [i, v] of Object.entries(view.pending)) upd[`answers/${r}/${pid}/${i}`] = v || null;
    view.pending = {};
    update(ref(db, roomPath()), upd);
  }
  function refreshAnswering() {
    const el = document.getElementById("progress"); if (!el) return;
    const n = arr(room.categories).length;
    el.innerHTML = playerChips(id => {
      const filled = Object.values(room.answers?.[room.round]?.[id] || {}).filter(v => v && String(v).trim()).length;
      return ` <small>${filled}/${n}</small>`;
    });
  }

  // ---------- Scoring ----------
  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/&/g, " and ").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const core = s => norm(s).replace(/^(the|a|an) /, "");
  const startsRight = (s, L) => { L = (L || "").toLowerCase(); return norm(s).startsWith(L) || core(s).startsWith(L); };

  function computeRound(r) {
    const cats = arr(room.categories);
    const ans = room.answers?.[r] || {}, votes = room.votes?.[r] || {};
    const ids = playerIds();
    const points = Object.fromEntries(ids.map(id => [id, 0]));
    const rows = cats.map((cat, i) => {
      const entries = ids.map(id => ({ id, text: String((ans[id] || {})[i] ?? "").trim() }));
      const counts = {};
      entries.forEach(e => { if (e.text) { e.key = core(e.text).replace(/ /g, ""); if (e.key) counts[e.key] = (counts[e.key] || 0) + 1; } });
      entries.forEach(e => {
        if (!e.text) { e.empty = true; e.pts = 0; return; }
        const v = (votes[i] || {})[e.id] || {};
        const vals = Object.values(v);
        e.ups = vals.filter(x => x === 1).length;
        e.downs = vals.filter(x => x === -1).length;
        e.myVote = v[pid] || 0;
        e.dup = !!e.key && counts[e.key] > 1;
        e.wrong = !startsRight(e.text, room.letter);
        e.valid = e.wrong ? e.ups > e.downs : e.downs <= e.ups;
        e.pts = !e.dup && e.valid ? 1 : 0;
        points[e.id] = (points[e.id] || 0) + e.pts;
      });
      // answered first, then empties
      entries.sort((a, b) => (a.empty ? 1 : 0) - (b.empty ? 1 : 0));
      return { cat, i, entries };
    });
    return { rows, points };
  }
  function totals() {
    const t = Object.fromEntries(playerIds().map(id => [id, 0]));
    for (const [, scores] of entriesOf(room.roundScores)) for (const [id, v] of entriesOf(scores)) t[id] = (t[id] || 0) + (v || 0);
    return t;
  }

  // ---------- Voting ----------
  function renderVoting() {
    $app.innerHTML = `
      ${topbar()}
      <div class="stage"><div class="letter">${esc(room.letter)}</div>
        <div><h2 style="margin:0">Time to vote</h2><div style="color:var(--muted);font-size:14px">Duplicates score 0. More 👎 than 👍 means no point.</div></div></div>
      <div id="votelist"></div>
      <div class="dock"><div class="inner">
        <div class="status" id="donestatus"></div>
        ${isHost() ? `<button class="small" id="force" title="Skip waiting for everyone">Skip</button>` : ""}
        <button class="go" id="done">I'm done voting</button>
      </div></div>`;
    wireCopy();
    document.getElementById("votelist").addEventListener("click", e => {
      const b = e.target.closest("button[data-v]"); if (!b) return;
      const { c, o, v } = b.dataset, val = Number(v);
      const cur = room.votes?.[room.round]?.[c]?.[o]?.[pid] || 0;
      set(ref(db, roomPath(`votes/${room.round}/${c}/${o}/${pid}`)), cur === val ? null : val);
    });
    document.getElementById("done").addEventListener("click", () =>
      set(ref(db, roomPath(`players/${pid}/done`)), !room.players[pid]?.done));
    document.getElementById("force")?.addEventListener("click", () => {
      if (confirm("Move on without waiting for everyone?")) finalizeRound();
    });
    refreshVoting();
  }
  function refreshVoting() {
    const list = document.getElementById("votelist"); if (!list) return;
    const { rows, points } = computeRound(room.round);
    list.innerHTML = rows.map(({ cat, i, entries }) => `
      <div class="cat card" style="padding:14px">
        <h3>${i + 1}. ${esc(cat)}</h3>
        ${entries.map(e => e.empty ? `
          <div class="ans empty"><div><span class="txt">—</span></div><div class="who">${esc(nameOf(e.id))}</div></div>` : `
          <div class="ans ${e.dup ? "dup" : !e.valid ? "invalid" : ""}">
            <div><span class="txt">${esc(e.text)}</span>
              ${e.dup ? `<span class="tag dup">Duplicate</span>` : ""}
              ${e.wrong ? `<span class="tag wrong">Wrong letter?</span>` : ""}
              <span class="tag ${e.pts ? "pt" : "zero"}">${e.pts ? "+1" : "0"}</span></div>
            <div class="votes">${e.id === pid
              ? `<span class="mine">your answer · 👍${e.ups} 👎${e.downs}</span>`
              : `<button class="up ${e.myVote === 1 ? "on" : ""}" data-c="${i}" data-o="${e.id}" data-v="1">👍 ${e.ups}</button>
                 <button class="down ${e.myVote === -1 ? "on" : ""}" data-c="${i}" data-o="${e.id}" data-v="-1">👎 ${e.downs}</button>`}</div>
            <div class="who">${esc(nameOf(e.id))}${e.id === pid ? " (you)" : ""}</div>
          </div>`).join("")}
      </div>`).join("") + `
      <div class="card" style="padding:14px"><h3>This round so far</h3>
        <div class="chips">${playerIds().map(id => `<span class="chip">${esc(nameOf(id))} <small>+${points[id] || 0}</small></span>`).join("")}</div></div>`;
    const on = onlineIds(), done = on.filter(id => room.players[id].done);
    const waiting = on.filter(id => !room.players[id].done).map(nameOf);
    document.getElementById("donestatus").innerHTML = `<b>${done.length}/${on.length}</b> done` +
      (waiting.length && waiting.length <= 3 ? ` · waiting on ${waiting.map(esc).join(", ")}` : "");
    const btn = document.getElementById("done"), me = room.players[pid]?.done;
    btn.textContent = me ? "Done ✓ (tap to undo)" : "I'm done voting";
    btn.classList.toggle("isdone", !!me);
  }

  function finalizeRound() {
    const r = room.round;
    if (acted === `final:${r}`) return;
    acted = `final:${r}`;
    const { points } = computeRound(r);
    const upd = {};
    for (const id of playerIds()) upd[`roundScores/${r}/${id}`] = points[id] || 0;
    const last = r >= room.settings.rounds;
    upd.phase = last ? "final" : "scores";
    upd.nextAt = now() + 12000;
    update(ref(db, roomPath()), upd);
  }

  // ---------- Scores / Final ----------
  function renderScores() {
    const r = room.round, isFinal = room.phase === "final";
    const tot = totals(), rs = room.roundScores?.[r] || {};
    const ids = playerIds().sort((a, b) => (tot[b] || 0) - (tot[a] || 0));
    const best = tot[ids[0]] || 0;
    const winners = ids.filter(id => (tot[id] || 0) === best);
    $app.innerHTML = `
      ${topbar()}
      <div class="card">
        ${isFinal ? `<div class="trophy">🏆</div><div class="winner">${winners.map(id => esc(nameOf(id))).join(" & ")} win${winners.length > 1 ? "" : "s"}!</div>`
                  : `<h2 style="margin-top:0">Round ${r} results</h2>`}
        <table><thead><tr><th>Player</th><th class="num">This round</th><th class="num">Total</th></tr></thead><tbody>
          ${ids.map(id => `<tr><td>${esc(nameOf(id))}${id === pid ? " (you)" : ""}</td><td class="num">+${rs[id] || 0}</td><td class="num"><b>${tot[id] || 0}</b></td></tr>`).join("")}
        </tbody></table>
        <div style="margin-top:18px">
          ${isFinal
            ? (isHost() ? `<button class="primary" id="again">Play again</button>` : `<div class="waiting">Waiting for ${esc(nameOf(hostId()))} to start a new game…</div>`)
            : `<div class="waiting" id="nextin">Next round soon…</div>${isHost() ? `<button class="primary" id="now">Start next round now</button>` : ""}`}
        </div>
      </div>`;
    wireCopy();
    document.getElementById("now")?.addEventListener("click", () => { acted = `start:${r}`; startRound(); });
    document.getElementById("again")?.addEventListener("click", () => update(ref(db, roomPath()), {
      phase: "lobby", round: 0, usedLetters: null, answers: null, votes: null, roundScores: null,
      categories: null, letter: null, nextAt: null, roundStartsAt: null, roundEndsAt: null
    }));
  }

  // ---------- Clock: timers + host automation ----------
  function fmt(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
  function tick() {
    if (!room || !CODE) return;
    const t = now();
    if (room.phase === "answering" && view.inputs) {
      const ov = document.getElementById("overlay"), timer = document.getElementById("timer");
      if (t < room.roundStartsAt) {
        ov.style.display = "grid";
        document.getElementById("count").textContent = Math.ceil((room.roundStartsAt - t) / 1000);
      } else {
        ov.style.display = "none";
        document.getElementById("letter").textContent = room.letter;
        if (t < room.roundEndsAt) {
          if (!view.started) { view.started = true; view.inputs.forEach(i => (i.disabled = false)); if (!("ontouchstart" in window)) view.inputs[0]?.focus(); }
          const left = room.roundEndsAt - t;
          timer.textContent = fmt(left);
          timer.className = "timer" + (left <= 10000 ? " low" : "");
        } else if (!view.locked) {
          view.locked = true;
          view.inputs.forEach(i => { if (i.value.trim() !== String(myAnswers()[i.dataset.i] ?? "")) view.pending[i.dataset.i] = i.value.trim(); i.disabled = true; });
          flush();
          timer.textContent = "Time's up!"; timer.className = "timer over";
        }
      }
    }
    if (room.phase === "scores") {
      const el = document.getElementById("nextin");
      if (el && room.nextAt) el.textContent = `Next round in ${Math.max(0, Math.ceil((room.nextAt - t) / 1000))}…`;
    }
    if (!isHost()) return;
    // Host-only automation (host = earliest-joined player who's online)
    if (room.phase === "answering" && t >= room.roundEndsAt + 1500 && acted !== `vote:${room.round}`) {
      acted = `vote:${room.round}`;
      update(ref(db, roomPath()), { phase: "voting" });
    }
    if (room.phase === "voting") {
      const on = onlineIds();
      if (on.length && on.every(id => room.players[id].done)) finalizeRound();
    }
    if (room.phase === "scores" && room.nextAt && t >= room.nextAt && acted !== `start:${room.round}`) {
      acted = `start:${room.round}`;
      startRound();
    }
  }
  setInterval(tick, 200);

  // ---------- Boot ----------
  const urlCode = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
  const savedName = store.get("sg_name");
  if (urlCode && savedName) joinRoom(urlCode, savedName);
  else renderHome();
}
</script>
</body>
</html>
