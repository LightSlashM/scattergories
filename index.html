<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3be0">
<title>Game Night</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2317183b'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23ffd23f' font-family='sans-serif' font-weight='800'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --cobalt: #2b3be0; --cobalt-deep: #1d28a6; --ink: #17183b; --paper: #ffffff;
  --pink: #ff6fb5; --sun: #ffd23f; --mint: #3ddc97; --tomato: #ff5a4f; --fog: #eef0ff; --muted: #6b6f93;
  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
  --font: "Bricolage Grotesque", ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font); color: var(--ink); font-size: 16px; line-height: 1.4;
  background-color: var(--cobalt);
  background-image: radial-gradient(rgba(255,255,255,.13) 1.4px, transparent 1.6px);
  background-size: 18px 18px; -webkit-font-smoothing: antialiased;
}
#app { max-width: 1120px; margin: 0 auto; padding: 14px 16px 120px; }
h1, h2, h3 { margin: 0; line-height: 1.1; }
h2 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; }
h3 { font-size: 17px; font-weight: 750; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* ---------- surfaces ---------- */
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r-lg); box-shadow: 7px 7px 0 var(--pink); padding: 20px; }
.card.flat { box-shadow: 4px 4px 0 var(--ink); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack > * + * { margin-top: 12px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--ink); border-radius: var(--r-md);
  padding: 11px 18px; font-weight: 750; background: var(--paper); color: var(--ink); cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
  transition: transform .06s ease, box-shadow .06s ease; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--fog); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--ink); }
.btn.primary { background: var(--sun); font-size: 18px; padding: 14px 22px; }
.btn.primary:hover { background: #ffdc66; }
.btn.good { background: var(--mint); }
.btn.wide { width: 100%; }
.btn.sm { padding: 6px 11px; font-size: 14px; border-width: 2.5px; box-shadow: 2px 2px 0 var(--ink); border-radius: var(--r-sm); }
.btn.sm:active { transform: translate(2px, 2px); }
.btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.75); box-shadow: none; }
.btn.ghost:hover { background: rgba(255,255,255,.12); }
.iconbtn { width: 40px; height: 40px; padding: 0; border-radius: 12px; }

/* ---------- inputs ---------- */
label.field { display: block; font-weight: 700; font-size: 14px; }
.input, select.input, textarea.input {
  display: block; width: 100%; margin-top: 6px; padding: 12px 14px; border: 3px solid var(--ink); border-radius: var(--r-md);
  background: #fff; outline: none; font-size: 16px;
}
.input:focus { box-shadow: 0 0 0 3px var(--sun); }
.input:disabled { background: var(--fog); color: var(--muted); }
textarea.input { resize: vertical; min-height: 70px; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; color: #fff; }
.brand { font-weight: 800; font-size: 20px; letter-spacing: -.4px; text-shadow: 2px 2px 0 var(--pink); margin-right: 4px; }
.roompill { background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-weight: 800; letter-spacing: 3px; }
.topbar .spacer { flex: 1; }
.roundinfo { font-weight: 700; }

/* ---------- home ---------- */
.home { display: grid; gap: 28px; padding-top: 4vh; }
.wordmark {
  font-size: clamp(64px, 13vw, 148px); font-weight: 800; color: #fff; letter-spacing: -4px; line-height: .86;
  text-shadow: 6px 6px 0 var(--pink); font-variation-settings: "opsz" 96;
}
.tagline { color: #fff; font-size: 19px; max-width: 34ch; margin-top: 14px; opacity: .92; }
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
.or { text-align: center; color: var(--muted); margin: 4px 0; font-size: 14px; }
.joinrow { display: flex; gap: 10px; }
.joinrow .input { margin-top: 0; text-transform: uppercase; letter-spacing: 6px; font-weight: 800; text-align: center; }
.err { color: var(--tomato); font-weight: 700; }

/* ---------- avatar builder ---------- */
.av { display: inline-block; flex: none; }
.av svg { display: block; width: 100%; height: 100%; }
.avbuilder { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: center; }
.avbuilder .preview { width: 150px; height: 150px; background: var(--fog); border: 3px solid var(--ink); border-radius: 50%; padding: 8px; }
.avrows { display: grid; gap: 8px; }
.avrow { display: grid; grid-template-columns: 64px 40px 1fr 40px; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.avrow .val { text-align: center; color: var(--muted); font-size: 13px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--ink); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sun); }

/* ---------- lobby ---------- */
.lobby { display: grid; grid-template-columns: 340px 1fr; gap: 26px; align-items: start; }
.plist { display: grid; gap: 8px; margin-top: 14px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: var(--r-md); }
.prow.me { background: var(--fog); }
.prow.off { opacity: .45; }
.prow .name { font-weight: 750; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .tag { font-size: 12px; font-weight: 700; color: var(--muted); }
.invite { display: flex; gap: 8px; align-items: center; background: var(--fog); border-radius: var(--r-md); padding: 8px 8px 8px 12px; margin-top: 16px; }
.invite span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0 20px; }
.gametile {
  text-align: left; border: 3px solid var(--ink); border-radius: var(--r-lg); padding: 16px; background: #fff; cursor: pointer;
  display: grid; gap: 6px; box-shadow: 3px 3px 0 var(--ink); position: relative;
}
.gametile[disabled] { cursor: default; }
.gametile .gt-title { font-size: 21px; font-weight: 800; letter-spacing: -.3px; }
.gametile .gt-desc { font-size: 14px; color: var(--muted); }
.gametile .gt-art { height: 64px; display: flex; align-items: center; gap: 6px; }
.gametile[aria-pressed="true"] { background: var(--sun); box-shadow: 5px 5px 0 var(--pink); }
.gametile[aria-pressed="true"] .gt-desc { color: var(--ink); }
.mini-die { width: 46px; height: 46px; border-radius: 12px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 28px; transform: rotate(-6deg); }
.mini-die:nth-child(2) { transform: rotate(5deg); background: var(--pink); color: var(--ink); }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 18px; }
.settings .val { font-size: 22px; font-weight: 800; margin-top: 6px; }
.waiting { text-align: center; color: var(--muted); padding: 14px; font-weight: 600; }

/* ---------- timer ring ---------- */
.ring { position: relative; width: 74px; height: 74px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: #fff; stroke: var(--fog); stroke-width: 7; }
.ring .bar { fill: none; stroke: var(--mint); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring.low .bar { stroke: var(--tomato); }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.ring.low .t { color: var(--tomato); }

/* ---------- scattergories ---------- */
.stage { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.die {
  width: 104px; height: 104px; border-radius: 26px; background: var(--ink); color: #fff; font-size: 66px; font-weight: 800;
  display: grid; place-items: center; box-shadow: 6px 6px 0 var(--pink); transform: rotate(-5deg); flex: none;
}
.die.rolling { animation: wobble .18s infinite alternate; }
.die.landed { animation: land .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes wobble { from { transform: rotate(-9deg) scale(.96); } to { transform: rotate(7deg) scale(1.04); } }
@keyframes land { from { transform: rotate(40deg) scale(.4); } to { transform: rotate(-5deg) scale(1); } }
.progress { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px 10px 3px 4px; font-weight: 700; font-size: 14px; }
.chip.me { background: var(--sun); }
.chip.off { opacity: .45; }
.chip.done { background: var(--mint); }
.chip small { font-weight: 600; color: var(--muted); }
.chip.me small, .chip.done small { color: var(--ink); }
.answers { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; counter-reset: c; }
.answers li { counter-increment: c; }
.answers label { font-weight: 750; font-size: 15px; }
.answers label::before { content: counter(c) ". "; color: var(--cobalt); }
.hint { color: #fff; text-align: center; margin: 16px 0 0; font-weight: 600; opacity: .9; }
.overlay { position: fixed; inset: 0; background: rgba(29,40,166,.82); display: grid; place-items: center; z-index: 40; text-align: center; color: #fff; }
.overlay .big { font-size: 150px; font-weight: 800; line-height: 1; text-shadow: 6px 6px 0 var(--pink); }

.cat { padding: 16px; }
.cat + .cat { margin-top: 18px; }
.cat h3 { margin-bottom: 10px; }
.ans { display: grid; grid-template-columns: 150px 1fr auto; gap: 6px 14px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--fog); border-left: 7px solid var(--mint); }
.ans + .ans { margin-top: 8px; }
.ans.invalid { border-left-color: var(--tomato); }
.ans.dup { border-left-color: var(--sun); }
.ans.empty { border-left-color: #cfd2ee; opacity: .6; padding: 6px 12px; }
.ans .who { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; min-width: 0; }
.ans .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ans .txt { font-weight: 800; font-size: 19px; word-break: break-word; }
.ans.invalid .txt, .ans.dup .txt { text-decoration: line-through; text-decoration-thickness: 3px; }
.tag { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 7px; margin-left: 6px; vertical-align: 3px; border: 2px solid var(--ink); background: #fff; }
.tag.dup { background: var(--sun); }
.tag.wrong { background: #ffd4d1; }
.tag.pt { background: var(--mint); }
.votes { display: flex; gap: 8px; }
.vote { min-width: 62px; padding: 7px 10px; font-size: 16px; font-weight: 800; }
.vote.on.up { background: var(--mint); }
.vote.on.down { background: var(--tomato); color: #fff; }
.mine { font-size: 13px; font-weight: 700; color: var(--muted); }
.voters { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.voter { color: var(--ink); display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px 2px 2px; border-radius: 999px; }
.voter.up { background: #c9f5df; }
.voter.down { background: #ffd4d1; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 3px solid var(--ink); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 20; }
.dock .inner { max-width: 1120px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.dock .status { flex: 1; font-size: 15px; min-width: 0; }
.dock .clock { font-weight: 800; font-variant-numeric: tabular-nums; }
.dock .clock.low { color: var(--tomato); }

/* ---------- scores / final ---------- */
.scoretable { width: 100%; border-collapse: collapse; margin-top: 10px; }
.scoretable td { padding: 9px 6px; border-bottom: 2px solid var(--fog); vertical-align: middle; }
.scoretable .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
.scoretable .plus { color: #1f9e5a; }
.pcell { display: flex; align-items: center; gap: 10px; font-weight: 750; }
.bar { height: 10px; background: var(--fog); border-radius: 99px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--cobalt); border-radius: 99px; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 14px; margin: 10px 0 22px; }
.pod { display: grid; justify-items: center; gap: 8px; width: 130px; }
.pod .block { width: 100%; border: 3px solid var(--ink); border-radius: 14px 14px 0 0; display: grid; place-items: center; font-size: 34px; font-weight: 800; }
.pod.p1 .block { height: 130px; background: var(--sun); }
.pod.p2 .block { height: 96px; background: #fff; }
.pod.p3 .block { height: 72px; background: var(--pink); }
.pod .pname { font-weight: 800; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod .pts { font-size: 14px; font-weight: 700; color: var(--muted); }
.winner { text-align: center; font-size: clamp(30px, 6vw, 48px); font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; }

/* ---------- sketch & guess ---------- */
.dhead { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 10px 16px; margin-bottom: 16px; }
.hintword { text-align: center; font-size: clamp(22px, 4vw, 34px); font-weight: 800; letter-spacing: 6px; overflow-wrap: anywhere; }
.hintword small { display: block; letter-spacing: 0; font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.dgrid { display: grid; grid-template-columns: 210px minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
.dplayers { padding: 10px; display: grid; gap: 4px; }
.dp { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 12px; }
.dp.me { background: var(--fog); }
.dp.got { background: #c9f5df; }
.dp.drawing { background: var(--sun); }
.dp.off { opacity: .45; }
.dp .info { flex: 1; min-width: 0; }
.dp .nm { font-weight: 750; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp .sc { font-size: 13px; color: var(--muted); font-weight: 650; }
.dp .st { font-size: 18px; }
.canvasbox { position: relative; border: 3px solid var(--ink); border-radius: var(--r-lg); overflow: hidden; background: #fff; box-shadow: 7px 7px 0 var(--pink); aspect-ratio: 4 / 3; }
.canvasbox canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.canvasbox.can-draw canvas { cursor: crosshair; }
.cvov { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(23,24,59,.78); color: #fff; text-align: center; padding: 20px; }
.cvov[hidden] { display: none; }
.cvov h2 { font-size: clamp(22px, 4vw, 34px); margin-bottom: 14px; }
.choices { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.reveal-word { display: inline-block; background: var(--sun); color: var(--ink); padding: 4px 14px; border-radius: 12px; border: 3px solid var(--ink); }
.turnpts { display: grid; gap: 4px; margin-top: 14px; font-weight: 700; min-width: 220px; }
.turnpts div { display: flex; justify-content: space-between; gap: 18px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; padding: 10px; }
.tools[hidden] { display: none; }
.palette { display: grid; grid-template-columns: repeat(7, 26px); gap: 5px; }
.pcol { width: 26px; height: 26px; border-radius: 7px; border: 2.5px solid var(--ink); cursor: pointer; padding: 0; }
.pcol[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sun); transform: scale(1.12); }
.sizes, .toolset { display: flex; gap: 6px; }
.tbtn { width: 42px; height: 42px; display: grid; place-items: center; border: 2.5px solid var(--ink); border-radius: 11px; background: #fff; cursor: pointer; font-size: 18px; padding: 0; }
.tbtn[aria-pressed="true"] { background: var(--sun); }
.tbtn .dot { background: var(--ink); border-radius: 50%; }
.react { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; color: #fff; font-weight: 700; }
.react[hidden] { display: none; }
.chat { display: flex; flex-direction: column; padding: 0; overflow: hidden; height: min(560px, 70vh); }
.chatlog { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.cm { display: flex; gap: 6px; align-items: flex-start; overflow-wrap: anywhere; }
.cm b { font-weight: 800; }
.cm.sys { color: var(--muted); font-style: italic; justify-content: center; text-align: center; }
.cm.good { color: #13804a; font-weight: 800; justify-content: center; text-align: center; background: #c9f5df; border-radius: 8px; padding: 4px; }
.cm.hidden { background: #e3f9ee; border-radius: 8px; padding: 3px 6px; }
.chatform { border-top: 3px solid var(--ink); display: flex; }
.chatform input { flex: 1; border: 0; padding: 14px; outline: none; min-width: 0; font-size: 16px; }
.chatform input:disabled { background: var(--fog); }

/* ---------- modal / toast ---------- */
.modal { position: fixed; inset: 0; background: rgba(23,24,59,.6); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal .card { width: min(560px, 100%); }
.toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; box-shadow: 4px 4px 0 var(--pink); animation: toastin .25s ease-out; }
.toast.good { background: var(--mint); color: var(--ink); border: 3px solid var(--ink); }
@keyframes toastin { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
.pop { animation: pop .35s cubic-bezier(.2,1.5,.4,1); }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .dgrid { grid-template-columns: minmax(0, 1fr); }
  .dplayers { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; order: -1; }
  .dp .sc { display: none; }
  .chat { height: 300px; }
}
@media (max-width: 820px) {
  .home-grid, .lobby { grid-template-columns: 1fr; }
  .answers { grid-template-columns: 1fr; }
  .ans { grid-template-columns: 1fr auto; }
  .ans .who { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  #app { padding: 10px 12px 120px; }
  .card { padding: 16px; box-shadow: 5px 5px 0 var(--pink); }
  .games { grid-template-columns: 1fr; }
  .avbuilder { grid-template-columns: 1fr; justify-items: center; }
  .avrows { width: 100%; }
  .die { width: 80px; height: 80px; font-size: 50px; }
  .dhead { grid-template-columns: auto 1fr; }
  .dhead .roundinfo { display: none; }
  .pod { width: 96px; }
  .overlay .big { font-size: 110px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, push, remove, onDisconnect, serverTimestamp,
  query, limitToLast, onChildAdded, onChildChanged, onChildRemoved }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

const Sound = {
  muted: store.get("gn_mute") === "1", ctx: null,
  unlock() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } this.ctx?.resume?.(); },
  tone(f, d, type = "sine", v = .07, at = 0) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
  },
  play(n) {
    if (n === "tick") this.tone(1046, .06, "square", .025);
    if (n === "start") { this.tone(523, .12, "triangle"); this.tone(784, .2, "triangle", .07, .1); }
    if (n === "good") { this.tone(659, .1, "triangle"); this.tone(880, .1, "triangle", .07, .08); this.tone(1319, .25, "triangle", .07, .16); }
    if (n === "end") { this.tone(587, .15, "triangle"); this.tone(440, .3, "triangle", .07, .14); }
    if (n === "pop") this.tone(740, .05, "sine", .05);
  }
};

/* ---------- confetti ---------- */
function confetti(n = 140) {
  if (reduceMotion()) return;
  const c = document.createElement("canvas"); c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:90";
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const ctx = c.getContext("2d"), cols = ["#ffd23f", "#ff6fb5", "#3ddc97", "#ffffff", "#ff5a4f"];
  const ps = Array.from({ length: n }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .4, vx: (Math.random() - .5) * 4,
    vy: 2 + Math.random() * 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 7, c: pick(cols) }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t - t0 < 3200) requestAnimationFrame(f); else c.remove();
  })(t0);
}

  }

  /* ---------- home ---------- */

  async function createRoom(name) {
    const chars = "ABCDEFGHJKLMNPRSTUVWXYZ"; let code;
    for (let i = 0; i < 10; i++) { code = Array.from({ length: 4 }, () => pick(chars)).join(""); if (!(await get(ref(db, `rooms/${code}/g/createdAt`))).exists()) break; }
    await set(ref(db, `rooms/${code}/g`), { createdAt: serverTimestamp(), mode: "scatter", phase: "lobby", round: 0, settings: DEFAULT_SETTINGS });
    joinRoom(code, name);
  }

  async function joinRoom(code, name) {
    try {
      if (!(await get(ref(db, `rooms/${code}/g/createdAt`))).exists()) return renderHome(`There's no room ${code}. Check the code with whoever invited you.`);
      CODE = code;
      const meRef = G(`players/${pid}`);
      if ((await get(meRef)).exists()) await update(meRef, { name, av: myAv, online: true });
      else await set(meRef, { name, av: myAv, joinedAt: serverTimestamp(), online: true, done: false });
      unsubs.forEach(u => u()); unsubs = [];
      unsubs.push(onValue(ref(db, ".info/connected"), s => {
        if (s.val() && CODE === code) { const r = G(`players/${pid}/online`); onDisconnect(r).set(false); set(r, true); }
      }));
      history.replaceState(null, "", `?room=${code}`);
      // chat + strokes live outside the game node so the main listener stays light
      chatMsgs = [];
      const cq = query(chatRef(), limitToLast(80));
      unsubs.push(onChildAdded(cq, s => { chatMsgs.push({ key: s.key, ...s.val() }); if (chatMsgs.length > 80) chatMsgs.shift(); renderChat(); }));
      unsubs.push(onChildRemoved(cq, s => { chatMsgs = chatMsgs.filter(m => m.key !== s.key); renderChat(); }));
      unsubs.push(onChildAdded(strokesRef(), s => onStroke("add", s.key, s.val())));
      unsubs.push(onChildChanged(strokesRef(), s => onStroke("change", s.key, s.val())));
      unsubs.push(onChildRemoved(strokesRef(), s => onStroke("remove", s.key)));
      unsubs.push(onValue(G(), s => { room = s.val(); onRoom(); }));
    } catch (e) { console.error(e); renderHome("Couldn't connect: " + e.message); }
  }

  function onRoom() {
    if (!room) { renderHome("That room no longer exists."); return; }
    if (room.phase === "lobby") acted = "";
    const draw = room.phase?.startsWith("d_");
    const key = draw ? `draw:${room.round}:${room.turn}:${isHost()}` : `${room.phase}:${room.round}:${isHost()}:${room.mode}`;
    if (key !== viewKey) {
      if (view.pending) flushAnswers();
      viewKey = key; view = {};
      ({ lobby: renderLobby, answering: renderAnswering, voting: renderVoting, scores: renderScores, final: renderFinal,
         d_choose: renderDraw, d_draw: renderDraw, d_reveal: renderDraw }[room.phase] || renderLobby)();
      $app.querySelector(".pop-target")?.classList.add("pop");
    } else {
      ({ lobby: refreshLobby, answering: refreshAnswering, voting: refreshVoting, d_choose: refreshDraw, d_draw: refreshDraw, d_reveal: refreshDraw }[room.phase] || (() => {}))();
    }
  }

  function resetToLobby() {

      usedLetters: null, draw: null, order: null, usedWords: null, votingEndsAt: null, nextAt: null, roundStartsAt: null, roundEndsAt: null,

  /* =================================================================== */
  /*  Scattergories                                                       */
  /* =================================================================== */
  function startRound() {
    const s = S(); let used = arr(room.usedLetters);
    let pool = LETTERS.filter(l => !used.includes(l)); if (!pool.length) { used = []; pool = LETTERS.slice(); }
    const letter = pick(pool), t = now();
    const upd = { mode: "scatter", phase: "answering", round: (room.round || 0) + 1, letter, usedLetters: [...used, letter],
      categories: shuffle(CATEGORIES.slice()).slice(0, s.cats), roundStartsAt: t + 4000, roundEndsAt: t + 4000 + s.timer * 1000,
      nextAt: null, votingEndsAt: null };
    for (const id of playerIds()) upd[`players/${id}/done`] = false;
    update(G(), upd);
  }
  const myAnswers = () => room.answers?.[room.round]?.[pid] || {};
  function renderAnswering() {
    const cats = arr(room.categories), mine = myAnswers();
    $app.innerHTML = `${topbar()}
      <div class="card" style="margin-bottom:20px"><div class="stage">
        <div class="die rolling" id="die" aria-live="polite">?</div>${ringHTML("ring")}<div class="progress" id="progress"></div></div></div>
      <section class="card pop-target"><ol class="answers">
        ${cats.map((c, i) => `<li><label for="a${i}">${esc(c)}</label><input class="input" id="a${i}" data-i="${i}" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60" disabled value="${esc(mine[i] ?? "")}"></li>`).join("")}
      </ol></section>
      <p class="hint">Answers save as you type and lock in when time runs out.</p>
      <div class="overlay" id="overlay"><div><p style="font-weight:700;font-size:20px">Round ${room.round} starts in</p><div class="big" id="count">3</div></div></div>`;
    wireChrome();
    view.pending = {}; view.round = room.round;
    view.inputs = [...$app.querySelectorAll(".answers input")];
    view.inputs.forEach((el, idx) => {
      el.addEventListener("input", () => { view.pending[el.dataset.i] = el.value.trim(); clearTimeout(view.t); view.t = setTimeout(flushAnswers, 350); });
      el.addEventListener("blur", flushAnswers);
      el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); view.inputs[idx + 1]?.focus(); } });
    });
    refreshAnswering(); tick();
  }
  function flushAnswers() {
    if (!view.pending || !Object.keys(view.pending).length || !CODE) return;
    const upd = {}; for (const [i, v] of Object.entries(view.pending)) upd[`answers/${view.round}/${pid}/${i}`] = v || null;
    view.pending = {}; update(G(), upd);
  }
  function refreshAnswering() {
    const el = $("progress"); if (!el) return;
    const n = arr(room.categories).length;
    el.innerHTML = playerIds().map(id => { const p = P(id);
      const filled = Object.values(room.answers?.[room.round]?.[id] || {}).filter(v => v && String(v).trim()).length;
      return `<span class="chip ${id === pid ? "me" : ""} ${p.online ? "" : "off"}">${avOf(id, 26)}${esc(p.name)} <small>${filled}/${n}</small></span>`; }).join("");
  }

  function computeRound(r) {
    const cats = arr(room.categories), ans = room.answers?.[r] || {}, votes = room.votes?.[r] || {}, ids = playerIds();
    const points = Object.fromEntries(ids.map(id => [id, 0]));
    const rows = cats.map((cat, i) => {
      const entries = ids.map(id => ({ id, text: String((ans[id] || {})[i] ?? "").trim() }));
      const counts = {};
      entries.forEach(e => { if (e.text) { e.key = core(e.text).replace(/ /g, ""); if (e.key) counts[e.key] = (counts[e.key] || 0) + 1; } });
      entries.forEach(e => {
        if (!e.text) { e.empty = true; e.pts = 0; return; }
        const v = (votes[i] || {})[e.id] || {};
        e.upIds = Object.keys(v).filter(k => v[k] === 1); e.downIds = Object.keys(v).filter(k => v[k] === -1);
        e.ups = e.upIds.length; e.downs = e.downIds.length; e.myVote = v[pid] || 0;
        e.dup = !!e.key && counts[e.key] > 1;
        const L = (room.letter || "").toLowerCase();
        e.wrong = !(norm(e.text).startsWith(L) || core(e.text).startsWith(L));
        e.valid = e.wrong ? e.ups > e.downs : e.downs <= e.ups;
        e.pts = !e.dup && e.valid ? 1 : 0;
        points[e.id] += e.pts;
      });
      entries.sort((a, b) => (a.empty ? 1 : 0) - (b.empty ? 1 : 0));
      return { cat, i, entries };
    });
    return { rows, points };
  }

  function renderVoting() {
    $app.innerHTML = `${topbar()}
      <div class="card" style="margin-bottom:20px"><div class="stage"><div class="die">${esc(room.letter)}</div>
        <div><h2>Time to vote</h2><p class="muted" style="margin-top:6px">Duplicates score nothing. An answer with more 👎 than 👍 doesn't count.</p></div></div></div>

  function voterChips(ids, cls) { return ids.map(id => `<span class="voter ${cls}" title="${esc(nameOf(id))}">${avOf(id, 20)}${esc(nameOf(id))}</span>`).join(""); }
  function refreshVoting() {
    const list = $("votelist"); if (!list) return;
    const { rows, points } = computeRound(room.round);
    list.innerHTML = rows.map(({ cat, i, entries }) => `
      <section class="card cat"><h3>${i + 1}. ${esc(cat)}</h3>
        ${entries.map(e => e.empty ? `<div class="ans empty"><div class="who">${avOf(e.id, 24)}<span>${esc(nameOf(e.id))}</span></div><div class="muted">No answer</div></div>` : `
          <div class="ans ${e.dup ? "dup" : !e.valid ? "invalid" : ""}">
            <div class="who">${avOf(e.id, 30)}<span>${esc(nameOf(e.id))}${e.id === pid ? " (you)" : ""}</span></div>
            <div><span class="txt">${esc(e.text)}</span>${e.dup ? `<span class="tag dup">Duplicate</span>` : ""}${e.wrong ? `<span class="tag wrong">Wrong letter?</span>` : ""}<span class="tag ${e.pts ? "pt" : ""}">${e.pts ? "+1" : "0"}</span></div>
            <div class="votes">${e.id === pid ? `<span class="mine">Your answer</span>` : `
              <button class="btn sm vote up ${e.myVote === 1 ? "on" : ""}" data-c="${i}" data-o="${e.id}" data-v="1" aria-pressed="${e.myVote === 1}" aria-label="Thumbs up, ${e.ups}">👍 ${e.ups}</button>
              <button class="btn sm vote down ${e.myVote === -1 ? "on" : ""}" data-c="${i}" data-o="${e.id}" data-v="-1" aria-pressed="${e.myVote === -1}" aria-label="Thumbs down, ${e.downs}">👎 ${e.downs}</button>`}</div>
            ${e.ups || e.downs ? `<div class="voters">${voterChips(e.upIds, "up")}${voterChips(e.downIds, "down")}</div>` : ""}
          </div>`).join("")}
      </section>`).join("") + `
      <section class="card cat"><h3>This round so far</h3><div class="progress" style="margin-top:8px">
        ${playerIds().map(id => `<span class="chip ${id === pid ? "me" : ""}">${avOf(id, 26)}${esc(nameOf(id))} <small>+${points[id] || 0}</small></span>`).join("")}</div></section>`;
    updateVoteDock();
  }
  function updateVoteDock() {
    const st = $("donestatus"); if (!st) return;
    const on = onlineIds(), done = on.filter(id => P(id).done), waiting = on.filter(id => !P(id).done).map(nameOf);
    let clock = room.votingEndsAt
      ? `<span class="clock ${room.votingEndsAt - now() <= 10000 ? "low" : ""}" id="voteclock">Moving on in ${fmt(room.votingEndsAt - now())}</span>`
      : `<span class="muted">The ${S().voteTime}s timer starts when ${esc(nameOf(hostId()))} is done</span>`;
    st.innerHTML = `<b>${done.length} of ${on.length} done</b>${waiting.length && waiting.length <= 3 ? ` <span class="muted">(waiting on ${waiting.map(esc).join(", ")})</span>` : ""}<br>${clock}`;
    const btn = $("done"), me = !!P(pid).done;
    btn.textContent = me ? "Done (tap to undo)" : "I'm done voting"; btn.classList.toggle("good", !me);
  }
  function finalizeRound() {
    const r = room.round; if (acted === `final:${r}`) return; acted = `final:${r}`;
    const { points } = computeRound(r), upd = {};
    for (const id of playerIds()) upd[`scores/s${r}/${id}`] = points[id] || 0;
    upd.phase = r >= S().rounds ? "final" : "scores"; upd.nextAt = now() + 12000;
    update(G(), upd);
  }
  function renderScores() {
    const r = room.round, tot = totals(), rs = room.scores?.[`s${r}`] || {};
    const ids = playerIds().sort((a, b) => (tot[b] || 0) - (tot[a] || 0)), max = Math.max(1, ...ids.map(id => tot[id] || 0));
    $app.innerHTML = `${topbar()}
      <section class="card pop-target" style="max-width:640px;margin:0 auto">

  /* ---------- guessing & chat ---------- */
  let chatMsgs = [];

  }

  /* =================================================================== */
  /*  Clock: timers + host automation                                     */
  /* =================================================================== */
  function tick() {

    // ----- Scattergories -----

      const ov = $("overlay"), die = $("die");

        } else if (!view.locked) {
          view.locked = true;
          view.inputs.forEach(i => { if (i.value.trim() !== String(myAnswers()[i.dataset.i] ?? "")) view.pending[i.dataset.i] = i.value.trim(); i.disabled = true; });
          flushAnswers(); Sound.play("end"); toast("Time's up. Answers locked in.");
        }
      }
    }
    if (room.phase === "voting" && room.votingEndsAt) {
      const vc = $("voteclock"), left = room.votingEndsAt - t;
      if (vc) { vc.textContent = `Moving on in ${fmt(left)}`; vc.classList.toggle("low", left <= 10000); } else updateVoteDock();
      tickSound(left);
    }
    if (room.phase === "scores" && room.nextAt) { const el = $("nextin"); if (el) el.textContent = `Next round in ${Math.max(0, Math.ceil((room.nextAt - t) / 1000))}`; }
    // ----- Sketch & Guess -----
    if (room.phase?.startsWith("d_") && $("dring")) {
      if (room.phase === "d_choose") setRing("dring", room.chooseEndsAt - t, 15000);
      if (room.phase === "d_draw") { const left = room.turnEndsAt - t; setRing("dring", left, s.drawTime * 1000); tickSound(left); }
      if (room.phase === "d_reveal") { setRing("dring", room.revealEndsAt - t, 7000); const n = $("nextturn"); if (n) n.textContent = `Next turn in ${Math.max(0, Math.ceil((room.revealEndsAt - t) / 1000))}`; }
    }
    if (!host) return;
    // ----- host automation (host = longest-joined player who's online) -----
    if (room.phase === "answering" && t >= room.roundEndsAt + 1500 && acted !== `vote:${room.round}`) { acted = `vote:${room.round}`; update(G(), { phase: "voting" }); }
    if (room.phase === "voting") {
      const on = onlineIds();
      if ((on.length && on.every(id => P(id).done)) || (room.votingEndsAt && t >= room.votingEndsAt)) finalizeRound();
    }
    if (room.phase === "scores" && room.nextAt && t >= room.nextAt && acted !== `start:${room.round}`) { acted = `start:${room.round}`; startRound(); }
    const d = room.draw;
    if (room.phase === "d_choose" && d) {
      if (!P(d.drawer).online && acted !== `skip:${d.tk}`) { acted = `skip:${d.tk}`; startTurn(room.round, room.turn + 1, arr(room.order)); }
      else if (t >= room.chooseEndsAt) chooseWord(pick(arr(d.choices)) || pick(WORDS));
    }
    if (room.phase === "d_draw" && d) {
      const others = onlineIds().filter(id => id !== d.drawer), g = d.guessed || {};
      if (t >= room.turnEndsAt || !P(d.drawer).online || (others.length && others.every(id => g[id]))) endTurn();
      else if (+s.hints && d.word) {
        const letters = [...d.word].map((c, i) => /[a-z0-9]/i.test(c) ? i : -1).filter(i => i >= 0);
        const maxRev = Math.min(3, Math.floor(letters.length / 3)), frac = (t - room.turnStartsAt) / (s.drawTime * 1000);
        const want = maxRev ? Math.floor(clamp((frac - .35) / .55, 0, 1) * maxRev + (frac >= .35 ? 1 : 0)) : 0;
        const rev = arr(d.reveal);
        if (Math.min(want, maxRev) > rev.length && acted !== `hint:${d.tk}:${rev.length}`) {
          acted = `hint:${d.tk}:${rev.length}`;
          const left = letters.filter(i => !rev.includes(i));
          if (left.length) set(G("draw/reveal"), [...rev, pick(left)]);
        }
      }
    }
    if (room.phase === "d_reveal" && t >= room.revealEndsAt) nextTurn();
  }
  setInterval(tick, 200);

  /* ---------- boot ---------- */
  const urlCode = (new URLSearchParams(location.search).get("room") || "").toUpperCase(), savedName = store.get("sg_name");
  if (urlCode && savedName) joinRoom(urlCode, savedName); else renderHome();
}
</script>
